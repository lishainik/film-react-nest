server {
    listen 80;
    server_name lowmill.nomorepartiessite.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jowmill.nomorepartiessite.ru;

    ssl_certificate     /etc/letsencrypt/live/lowmill.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lowmill.nomorepartiessite.ru/privkey.pem;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}